<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = desc.get.call(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () { return currentFetch; },
              set: function (fn) { if (typeof fn === 'function') currentFetch = fn; }
            });
          }
        } catch (e) {}

        window.addEventListener('error', function (event) {
          var msg = String((event && event.message) || '');
          var file = String((event && event.filename) || '');
          if (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            file.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
